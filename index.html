<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Söz dəftərim</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;padding:24px 12px}
.app{background:#fff;border-radius:16px;width:100%;max-width:480px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
h1{font-size:22px;color:#333;margin-bottom:4px}
.sub{color:#888;font-size:13px;margin-bottom:18px}
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border:none;border-radius:10px;background:#f0f0f7;color:#667eea;font-size:14px;font-weight:600;cursor:pointer}
.tabs button.on{background:#667eea;color:#fff}
.hide{display:none!important}
.inputs{display:flex;gap:8px;margin-bottom:10px}
.inputs input{flex:1;padding:10px 12px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;outline:none}
.inputs input:focus{border-color:#667eea}
button.add{width:100%;padding:12px;border:none;border-radius:10px;background:#667eea;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:14px}
.toolbar{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.toolbar input{flex:1;padding:9px 12px;border:1.5px solid #ddd;border-radius:10px;font-size:14px;outline:none}
.count{font-size:13px;color:#888;white-space:nowrap}
li{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:#f7f7fb;margin-bottom:6px;font-size:15px;list-style:none}
.w{font-weight:600;color:#333}.t{color:#667eea;font-weight:400}.a{color:#aaa;margin:0 6px;font-size:13px}
.del{background:none;border:none;color:#ccc;font-size:18px;cursor:pointer}
.del:hover{color:#e74c3c}
.empty{text-align:center;color:#aaa;padding:30px 0;font-size:14px}
.card{text-align:center;padding:20px 0}
.qn{color:#888;font-size:13px;margin-bottom:8px}
.qw{font-size:34px;font-weight:700;color:#333;margin-bottom:16px}
.card input{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;font-size:16px;text-align:center;outline:none;margin-bottom:12px}
.card input:focus{border-color:#667eea}
.big{width:100%;padding:13px;border:none;border-radius:10px;background:#764ba2;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px}
.ghost{width:100%;padding:11px;border:1.5px solid #ddd;border-radius:10px;background:#fff;color:#667eea;font-size:14px;font-weight:600;cursor:pointer}
.fb{min-height:22px;margin-bottom:10px;font-size:15px;font-weight:600}
.good{color:#2ecc71}.bad{color:#e74c3c}
.sc{font-size:42px;font-weight:700;color:#667eea;margin:10px 0}
.st{text-align:center;font-size:13px;color:#888;min-height:18px;margin-bottom:8px}
label.fl{flex:1;padding:11px;border:1.5px solid #ddd;border-radius:10px;text-align:center;font-size:13px;font-weight:600;cursor:pointer}
label.fl:hover{border-color:#667eea;color:#667eea}
</style>
</head>
<body>
<div class="app">
<h1>📖 Söz dəftərim</h1>
<p class="sub">İngilis sözlərini saxla və test et.</p>
<div class="tabs">
<button class="on" id="tb1" onclick="tab(1)">📚 Sözlər</button>
<button id="tb2" onclick="tab(2)">✍️ Test</button>
<button id="tb3" onclick="tab(3)">🔄 Eksport</button>
</div>

<div id="v1">
<div class="inputs"><input id="en" placeholder="İngiliscə söz"><input id="az" placeholder="Azərbaycanca tərcümə"></div>
<button class="add" onclick="add()">+ Əlavə et</button>
<div class="toolbar"><input id="sr" placeholder="🔍 Axtar..." oninput="draw()"><span class="count" id="cn"></span></div>
<ul id="ls"></ul>
<div class="empty" id="em">Hələ heç bir söz əlavə etməmisən.</div>
</div>

<div id="v2" class="hide">
<div id="ts" class="card">
<p id="ti" style="color:#888;font-size:14px;margin-bottom:14px"></p>
<button class="big" onclick="start()">▶ Testə başla</button>
</div>
<div id="tr" class="card hide">
<p class="qn" id="qn"></p>
<p class="qw" id="qw"></p>
<input id="an" placeholder="Tərcüməsini yaz...">
<div class="fb" id="fb"></div>
<button class="big" id="ck" onclick="check()">Yoxla</button>
<button class="ghost hide" id="nx" onclick="next()">Növbəti →</button>
</div>
<div id="tf" class="card hide">
<p style="color:#888">Test bitdi! Nəticən:</p>
<p class="sc" id="sc"></p>
<button class="big" onclick="start()">🔄 Yenidən başla</button>
<button class="ghost" onclick="tab(1)">Sözlərə qayıt</button>
</div>
</div>

<div id="v3" class="hide">
<p class="st" id="st"></p>
<div style="display:flex;gap:8px;margin-bottom:10px">
<label class="fl">⬇ Sözləri fayla çıxar<button onclick="exp()" style="display:none"></button></label>
<label class="fl">⬆ Fayldan yüklə<input type="file" accept=".json" style="display:none" onchange="imp(event)"></label>
</div>
<p style="font-size:12px;color:#aaa;line-height:1.6;background:#f7f7fb;border-radius:10px;padding:10px 14px">Fayl ilə cihazlar arasında daşı: kompüterdə "çıxar", özünə göndər, telefonda "yüklə".</p>
</div>
</div>
<script>
const KEY='sd-v1';
let ws=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(ws))}
function tab(n){[1,2,3].forEach(i=>{$('v'+i).classList.toggle('hide',i!==n);$('tb'+i).classList.toggle('on',i===n)});if(n===2)$('ti').textContent=ws.length?ws.length+' sözdən 15-i ilə test':''}
function add(){const e=$('en').value.trim(),a=$('az').value.trim();if(!e||!a)return;ws.push({en:e,az:a});ws.sort((x,y)=>x.en.localeCompare(y.en,'en',{sensitivity:'base'}));save();draw();$('en').value='';$('az').value='';$('en').focus()}
function del(i){ws.splice(i,1);save();draw()}
function draw(){const q=$('sr').value.trim().toLowerCase();const f=ws.filter(w=>w.en.toLowerCase().includes(q)||w.az.toLowerCase().includes(q));$('cn').textContent=ws.length+' söz';$('em').style.display=ws.length?'none':'block';$('ls').innerHTML='';f.forEach(w=>{const i=ws.indexOf(w);const li=document.createElement('li');li.innerHTML=`<span class="w">${esc(w.en)}<span class="a">→</span><span class="t">${esc(w.az)}</span></span><button class="del" onclick="del(${i})">✕</button>`;$('ls').appendChild(li)})}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
let q=[],n=0,ok=0;
function start(){if(!ws.length){tab(1);return}q=ws.slice().sort(()=>Math.random()-.5).slice(0,Math.min(ws.length,15));n=0;ok=0;$('ts').classList.add('hide');$('tf').classList.add('hide');$('tr').classList.remove('hide');show()}
function show(){const w=q[n];$('qn').textContent=`Sual ${n+1} / ${q.length}`;$('qw').textContent=w.en;const a=$('an');a.value='';a.disabled=false;a.focus();$('fb').textContent='';$('fb').className='fb';$('ck').classList.remove('hide');$('nx').classList.add('hide');$('nx').textContent=n===q.length-1?'Nəticəni gör →':'Növbəti →'}
function check(){const w=q[n],a=$('an'),v=a.value.trim().toLowerCase();a.disabled=true;if(v===w.az.trim().toLowerCase()){ok++;$('fb').textContent='✅ Düzdür!';$('fb').className='fb good'}else{$('fb').textContent='❌ Düzgün cavab: '+w.az;$('fb').className='fb bad'}$('ck').classList.add('hide');$('nx').classList.remove('hide')}
function next(){n++;if(n>=q.length){$('tr').classList.add('hide');$('tf').classList.remove('hide');$('sc').textContent=ok+' / '+q.length}else show()}
function exp(){const b=new Blob([JSON.stringify(ws,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sozlerim.json';a.click();$('st').textContent='✅ Fayl yükləndi.'}
function imp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;const k=new Set(ws.map(w=>w.en.toLowerCase()));let c=0;d.forEach(w=>{if(w.en&&w.az&&!k.has(w.en.toLowerCase())){ws.push({en:w.en,az:w.az});c++}});ws.sort((x,y)=>x.en.localeCompare(y.en,'en',{sensitivity:'base'}));save();draw();$('st').textContent='✅ '+c+' yeni söz əlavə olundu.'}catch(x){$('st').textContent='❌ Fayl düzgün deyil.'}};r.readAsText(f);e.target.value=''}
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(!$('v2').classList.contains('hide')){if(!$('ck').classList.contains('hide'))check();else if(!$('nx').classList.contains('hide'))next()}else if(!$('v1').classList.contains('hide'))add()});
draw();
</script>
</body>
</html>
